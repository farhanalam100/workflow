name: Daily Commit

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make daily update
        run: |
          echo "Last updated: $(date -u)" > daily-update.txt

      - name: Commit changes
        run: |
          git config user.name "farhanalam100"
          git config user.email "253337841+farhanalam100@users.noreply.github.com"
          git add daily-update.txt
          git commit -m "Daily update $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
